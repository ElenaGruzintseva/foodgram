name: Foodgram workflow

on: push

jobs:

  build_and_push_to_docker_hub:
    name: Push Docker image to DockerHub
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Login to Docker
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Push to DockerHub
        uses: docker/build-push-action@v4
        with:
          context: ./backend/
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/foodgram_backend:latest

  build_frontend_and_push_to_docker_hub:
    name: Push frontend Docker image to DockerHub
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Login to Docker 
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Push to DockerHub
        uses: docker/build-push-action@v4
        with:
          context: ./frontend/
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/foodgram_frontend:latest

  build_gateway_and_push_to_docker_hub:
    name: Push gateway Docker image to DockerHub
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Login to Docker
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Push to DockerHub
        uses: docker/build-push-action@v4
        with:
          context: ./infra/
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/foodgram_gateway:latest

  deploy:
    runs-on: ubuntu-latest
    needs:
      - build_and_push_to_docker_hub
      - build_frontend_and_push_to_docker_hub
      - build_gateway_and_push_to_docker_hub
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up KUBECONFIG
        run: |
          mkdir -p ~/.kube
          echo "$KUBECONFIG" > ~/.kube/config
        env:
          KUBECONFIG: ${{ secrets.KUBECONFIG }}

      - name: Ungdate Kubernetes Deployment (Backend)
        run: |
          kubectl set image deployment/foodgram-backend-deployment foodgram-backend=${{ secrets.DOCKER_USERNAME }}/foodgram_backend:latest
        env:
          KUBECONFIG: ${{ secrets.KUBECONFIG }}

      - name: Run collectstatic in Backend Pod
        run: |
          kubectl exec deployment/foodgram-backend-deployment -- python manage.py collectstatic --noinput
        env:
          KUBECONFIG: ${{ secrets.KUBECONFIG }}
      
      - name: Copy static files in Backend Pod
        run: |
          kubectl exec deployment/foodgram-backend-deployment -- cp -r /app/static/ /static/
        env:
          KUBECONFIG: ${{ secrets.KUBECONFIG }}

      - name: Run migrations in Backend Pod
        run: |
          kubectl exec deployment/foodgram-backend-deployment -- python manage.py migrate
        env:
          KUBECONFIG: ${{ secrets.KUBECONFIG }}

      - name: Create superuser in Backend Pod
        run: |
          kubectl exec deployment/foodgram-backend-deployment -- python manage.py create_superuser -u
        env:
          KUBECONFIG: ${{ secrets.KUBECONFIG }}

      - name: Load initial data in Backend Pod
        run: |
          kubectl exec deployment/foodgram-backend-deployment -- python manage.py load_users
          kubectl exec deployment/foodgram-backend-deployment -- python manage.py load_tags
          kubectl exec deployment/foodgram-backend-deployment -- python manage.py load_ingredients
          kubectl exec deployment/foodgram-backend-deployment -- python manage.py load_recipes
        env:
          KUBECONFIG: ${{ secrets.KUBECONFIG }}

  send_message:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Send message
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: ${{ github.actor}} выполнил деплой Foodgram с комитом ${{ github.event.commits[0].message }}. https://github.com/${{ github.repository }}/commit/${{github.sha}}
